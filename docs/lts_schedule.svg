<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="activeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="maintenanceGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="eolGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="highlightRow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #94A3B8; }
    .brand-pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #00D2FF; letter-spacing: 1.2px; text-transform: uppercase; }
    .version-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #F8FAFC; }
    .version-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #94A3B8; }
    .bar-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #FFFFFF; }
    .legend-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #CBD5E1; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; }
    .milestone-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #00D2FF; letter-spacing: 0.5px; }
    .footer-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #94A3B8; }
  </style>

  <!-- Canvas Background -->
  <rect width="960" height="530" rx="16" fill="url(#bgGradient)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Outer Card Frame -->
  <rect x="20" y="20" width="920" height="490" rx="12" fill="none" stroke="#1E293B" stroke-width="1" />

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(40, 42)">
    <!-- XYO Brand Tag -->
    <rect x="0" y="0" width="110" height="20" rx="10" fill="#2563EB" fill-opacity="0.2" stroke="#00D2FF" stroke-opacity="0.4" stroke-width="1" />
    <text x="55" y="14" text-anchor="middle" class="brand-pill">XYO FINANCIAL</text>

    <!-- Title & Subtitle -->
    <text x="122" y="15" class="title">.NET &amp; C# Runtime LTS Support Lifecycle</text>
    <text x="0" y="38" class="subtitle">Official Microsoft .NET LTS support cadences, 3-month proactive upgrade windows, and SDK baselines</text>
  </g>

  <!-- ==================== LEGEND ==================== -->
  <g transform="translate(40, 100)">
    <!-- Active LTS -->
    <rect x="0" y="2" width="14" height="14" rx="3" fill="url(#activeGradient)" />
    <text x="22" y="14" class="legend-text">Active LTS / STS</text>

    <!-- Maintenance / Proactive Sunset -->
    <rect x="160" y="2" width="14" height="14" rx="3" fill="url(#maintenanceGradient)" />
    <text x="182" y="14" class="legend-text">3-Month Proactive Window</text>

    <!-- End of Life -->
    <rect x="375" y="2" width="14" height="14" rx="3" fill="url(#eolGradient)" />
    <text x="397" y="14" class="legend-text">End of Life (EOL)</text>

    <!-- Baseline Indicator -->
    <rect x="540" y="2" width="14" height="14" rx="3" fill="#2563EB" stroke="#00D2FF" stroke-width="1.5" />
    <text x="562" y="14" class="legend-text">SDK Minimum Baseline (.NET 8+)</text>

    <!-- Today Indicator Legend -->
    <line x1="800" y1="2" x2="800" y2="16" stroke="#00D2FF" stroke-width="2.5" stroke-dasharray="3,3" />
    <circle cx="800" cy="9" r="3.5" fill="#00D2FF" />
    <text x="812" y="14" class="legend-text">2026 Milestone</text>
  </g>

  <!-- Separator Line -->
  <line x1="40" y1="128" x2="920" y2="128" stroke="#1E293B" stroke-width="1" />

  <!-- ==================== TIMELINE GRID ==================== -->
  <!-- Timeline Origin: X = 230 to X = 910 (680px for 8 years: 2022 to 2030, 85px/year) -->
  <g transform="translate(0, 140)">
    <!-- Year Axis Headers & Vertical Grid Lines -->
    <!-- 2022 -->
    <text x="230" y="16" text-anchor="middle" class="axis-label">2022</text>
    <line x1="230" y1="26" x2="230" y2="295" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4" />

    <!-- 2023 -->
    <text x="315" y="16" text-anchor="middle" class="axis-label">2023</text>
    <line x1="315" y1="26" x2="315" y2="295" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4" />

    <!-- 2024 -->
    <text x="400" y="16" text-anchor="middle" class="axis-label">2024</text>
    <line x1="400" y1="26" x2="400" y2="295" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4" />

    <!-- 2025 -->
    <text x="485" y="16" text-anchor="middle" class="axis-label">2025</text>
    <line x1="485" y1="26" x2="485" y2="295" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4" />

    <!-- 2026 -->
    <text x="570" y="16" text-anchor="middle" class="axis-label" fill="#00D2FF">2026</text>
    <line x1="570" y1="26" x2="570" y2="295" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4" />

    <!-- 2027 -->
    <text x="655" y="16" text-anchor="middle" class="axis-label">2027</text>
    <line x1="655" y1="26" x2="655" y2="295" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4" />

    <!-- 2028 -->
    <text x="740" y="16" text-anchor="middle" class="axis-label">2028</text>
    <line x1="740" y1="26" x2="740" y2="295" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4" />

    <!-- 2029 -->
    <text x="825" y="16" text-anchor="middle" class="axis-label">2029</text>
    <line x1="825" y1="26" x2="825" y2="295" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4" />

    <!-- 2030 -->
    <text x="910" y="16" text-anchor="middle" class="axis-label">2030</text>
    <line x1="910" y1="26" x2="910" y2="295" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4" />
  </g>

  <!-- ==================== TIMELINE ROWS ==================== -->

  <!-- ROW 1: .NET 10 LTS (y = 175) -->
  <g transform="translate(40, 175)">
    <rect x="0" y="0" width="180" height="54" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="24" class="version-title">.NET 10 LTS</text>
    <text x="14" y="42" class="version-sub">Nov 2025 – Nov 2028</text>
    <rect x="100" y="10" width="70" height="18" rx="4" fill="#065F46" fill-opacity="0.3" stroke="#10B981" stroke-width="1" />
    <text x="135" y="22" text-anchor="middle" class="badge-text" fill="#10B981">NEXT LTS</text>

    <!-- Starts Nov 2025: x = 190 + (2025.875 - 2022)*85 = 190 + 329 = 519 -->
    <!-- Active: Nov 2025 to Aug 2028 (w = 234) -->
    <rect x="519" y="13" width="234" height="28" rx="6" fill="url(#activeGradient)" filter="url(#dropShadow)" />
    <text x="636" y="31" text-anchor="middle" class="bar-text">Active LTS Support</text>

    <!-- 3-Month Window: Aug 2028 to Nov 2028 (w = 21) -->
    <path d="M 753,13 L 774,13 A 6,6 0 0 1 780,19 L 780,35 A 6,6 0 0 1 774,41 L 753,41 Z" fill="url(#maintenanceGradient)" />
  </g>

  <!-- ROW 2: .NET 9 STS (y = 240) -->
  <g transform="translate(40, 240)">
    <rect x="0" y="0" width="180" height="54" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="24" class="version-title">.NET 9 STS</text>
    <text x="14" y="42" class="version-sub">Nov 2024 – May 2026</text>
    <rect x="100" y="10" width="70" height="18" rx="4" fill="#065F46" fill-opacity="0.3" stroke="#10B981" stroke-width="1" />
    <text x="135" y="22" text-anchor="middle" class="badge-text" fill="#10B981">STS</text>

    <!-- Starts Nov 2024: x = 190 + (2024.875 - 2022)*85 = 190 + 244 = 434 -->
    <!-- Active to Feb 2026: x = 434 to x = 540, w = 106 -->
    <rect x="434" y="13" width="106" height="28" rx="6" fill="url(#activeGradient)" filter="url(#dropShadow)" />
    <text x="487" y="31" text-anchor="middle" class="bar-text">STS</text>

    <!-- 3-Month Window: Feb 2026 to May 2026 (w = 21) -->
    <rect x="540" y="13" width="21" height="28" fill="url(#maintenanceGradient)" />

    <!-- EOL: after May 2026 (x = 561 to 870, w = 309) -->
    <path d="M 561,13 L 864,13 A 6,6 0 0 1 870,19 L 870,35 A 6,6 0 0 1 864,41 L 561,41 Z" fill="url(#eolGradient)" />
    <text x="715" y="31" text-anchor="middle" class="bar-text">End of Life (STS)</text>
  </g>

  <!-- ROW 3: .NET 8 LTS (y = 305) - HIGHLIGHTED AS MINIMUM BASELINE -->
  <g transform="translate(40, 305)">
    <!-- Row Highlight Backdrop -->
    <rect x="-6" y="-3" width="882" height="60" rx="10" fill="url(#highlightRow)" stroke="#2563EB" stroke-width="1" stroke-opacity="0.5" />

    <!-- Row Label Area -->
    <rect x="0" y="0" width="180" height="54" rx="8" fill="#0F172A" stroke="#00D2FF" stroke-width="1.2" />
    <text x="14" y="24" class="version-title" fill="#00D2FF">.NET 8 LTS</text>
    <text x="14" y="42" class="version-sub">Nov 2023 – Nov 2026</text>
    <rect x="94" y="10" width="78" height="18" rx="4" fill="#2563EB" fill-opacity="0.3" stroke="#00D2FF" stroke-width="1" />
    <text x="133" y="22" text-anchor="middle" class="badge-text" fill="#00D2FF">BASELINE</text>

    <!-- Starts Nov 2023: x = 190 + (2023.875 - 2022)*85 = 190 + 159 = 349 -->
    <!-- Active: Nov 2023 to Aug 2026 (x = 349 to x = 583, w = 234) -->
    <rect x="349" y="13" width="234" height="28" rx="6" fill="url(#activeGradient)" filter="url(#dropShadow)" />
    <text x="466" y="31" text-anchor="middle" class="bar-text">Active LTS (Minimum SDK Baseline)</text>

    <!-- 3-Month Proactive Window: Aug 2026 to Nov 2026 (x = 583 to 604, w = 21) -->
    <rect x="583" y="13" width="21" height="28" fill="url(#maintenanceGradient)" />

    <!-- EOL after Nov 2026: x = 604 to 870, w = 266 -->
    <path d="M 604,13 L 864,13 A 6,6 0 0 1 870,19 L 870,35 A 6,6 0 0 1 864,41 L 604,41 Z" fill="url(#eolGradient)" />
    <text x="737" y="31" text-anchor="middle" class="bar-text">EOL</text>
  </g>

  <!-- ROW 4: .NET 6 LTS (y = 370) -->
  <g transform="translate(40, 370)">
    <rect x="0" y="0" width="180" height="54" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="24" class="version-title" fill="#94A3B8">.NET 6 LTS</text>
    <text x="14" y="42" class="version-sub">Nov 2021 – Nov 2024</text>
    <rect x="100" y="10" width="70" height="18" rx="4" fill="#7F1D1D" fill-opacity="0.3" stroke="#EF4444" stroke-width="1" />
    <text x="135" y="22" text-anchor="middle" class="badge-text" fill="#EF4444">EOL</text>

    <!-- Active 2022 to Aug 2024: x = 190 to x = 405, w = 215 -->
    <rect x="190" y="13" width="215" height="28" rx="6" fill="url(#activeGradient)" />
    <text x="297" y="31" text-anchor="middle" class="bar-text">Active (Past)</text>

    <!-- 3-Month Window: Aug 2024 to Nov 2024 (w = 21) -->
    <rect x="405" y="13" width="21" height="28" fill="url(#maintenanceGradient)" />

    <!-- EOL: after Nov 2024 (x = 426 to 870, w = 444) -->
    <path d="M 426,13 L 864,13 A 6,6 0 0 1 870,19 L 870,35 A 6,6 0 0 1 864,41 L 426,41 Z" fill="url(#eolGradient)" />
    <text x="648" y="31" text-anchor="middle" class="bar-text">End of Life / Unsupported</text>
  </g>

  <!-- ==================== CURRENT 2026 MILESTONE ==================== -->
  <g transform="translate(570, 132)">
    <line x1="0" y1="20" x2="0" y2="300" stroke="#00D2FF" stroke-width="2" stroke-dasharray="4,4" filter="url(#cyanGlow)" />
    <line x1="0" y1="20" x2="0" y2="300" stroke="#00D2FF" stroke-width="2" stroke-dasharray="4,4" />

    <rect x="-52" y="0" width="104" height="22" rx="11" fill="#0B0F19" stroke="#00D2FF" stroke-width="1.5" filter="url(#dropShadow)" />
    <circle cx="-38" cy="11" r="3.5" fill="#00D2FF" />
    <text x="6" y="15" text-anchor="middle" class="milestone-text">TODAY (2026)</text>
  </g>

  <!-- ==================== FOOTER / POLICY BANNER ==================== -->
  <g transform="translate(40, 442)">
    <rect x="0" y="0" width="880" height="52" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1" />
    <rect x="14" y="14" width="130" height="24" rx="6" fill="#2563EB" fill-opacity="0.25" stroke="#00D2FF" stroke-width="1" />
    <text x="79" y="30" text-anchor="middle" class="brand-pill" font-size="10px">LTS POLICY PROMISE</text>
    <text x="156" y="31" class="footer-text">
      <tspan fill="#F8FAFC" font-weight="600">Strict Microsoft .NET Alignment:</tspan>
      <tspan fill="#CBD5E1"> Minimum supported runtime is </tspan>
      <tspan fill="#00D2FF" font-weight="700">.NET 8 LTS</tspan>
      <tspan fill="#CBD5E1">. Proactive baseline upgrades are initiated </tspan>
      <tspan fill="#10B981" font-weight="600">3 months prior</tspan>
      <tspan fill="#CBD5E1"> to official Microsoft runtime EOL.</tspan>
    </text>
  </g>
</svg>
